<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soil Analysis | Smart Agro Care</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<div class="logo">🌾 Smart Agro Care</div>

<nav>

<a href="index.html">Home</a>

<a href="soil.html">Soil</a>

<a href="disease.html">Disease</a>

<a href="fertilizer.html">Fertilizer</a>

<a href="chatbot.html">AI Chatbot</a>

<a href="contact.html">Contact</a>

</nav>

</header>

<section class="soil-page">

<h1>🌱 Smart Soil Analysis</h1>

<p>Enter your soil details below.</p>

<div class="soil-container">

<div class="soil-form">

<label>Soil Type</label>

<select id="soilType">

<option>Black Soil</option>

<option>Red Soil</option>

<option>Alluvial Soil</option>

<option>Laterite Soil</option>

<option>Sandy Soil</option>

<option>Clay Soil</option>

</select>

<label>Soil pH</label>

<input type="number" id="ph" placeholder="Example: 6.8">

<label>Nitrogen (N)</label>

<input type="number" id="nitrogen" placeholder="0-100">

<label>Phosphorus (P)</label>

<input type="number" id="phosphorus" placeholder="0-100">

<label>Potassium (K)</label>

<input type="number" id="potassium" placeholder="0-100">

<button onclick="analyzeSoil()">Analyze Soil</button>

</div>

<div class="result-box">

<h2>Analysis Result</h2>

<p><b>🌱 Recommended Crop:</b> <span id="crop">-</span></p>

<p><b>💧 Water Needed:</b> <span id="water">-</span></p>

<p><b>🧪 Soil Health Score:</b> <span id="score">-</span></p>

<p><b>🌾 Fertility:</b> <span id="fertility">-</span></p>

</div>

</div>

</section>

<script>

function analyzeSoil(){

let soil=document.getElementById("soilType").value;

if(soil=="Black Soil"){

document.getElementById("crop").innerHTML="Cotton, Soybean";

document.getElementById("water").innerHTML="20-25 mm/week";

document.getElementById("score").innerHTML="92%";

document.getElementById("fertility").innerHTML="Excellent";

}

else if(soil=="Red Soil"){

document.getElementById("crop").innerHTML="Groundnut, Millets";

document.getElementById("water").innerHTML="15-20 mm/week";

document.getElementById("score").innerHTML="80%";

document.getElementById("fertility").innerHTML="Good";

}

else if(soil=="Alluvial Soil"){

document.getElementById("crop").innerHTML="Rice, Wheat, Sugarcane";

document.getElementById("water").innerHTML="25-30 mm/week";

document.getElementById("score").innerHTML="95%";

document.getElementById("fertility").innerHTML="Excellent";

}

else if(soil=="Laterite Soil"){

document.getElementById("crop").innerHTML="Tea, Coffee, Cashew";

document.getElementById("water").innerHTML="20 mm/week";

document.getElementById("score").innerHTML="75%";

document.getElementById("fertility").innerHTML="Medium";

}

else if(soil=="Sandy Soil"){

document.getElementById("crop").innerHTML="Watermelon, Coconut";

document.getElementById("water").innerHTML="35 mm/week";

document.getElementById("score").innerHTML="70%";

document.getElementById("fertility").innerHTML="Low";

}

else{

document.getElementById("crop").innerHTML="Rice, Vegetables";

document.getElementById("water").innerHTML="30 mm/week";

document.getElementById("score").innerHTML="85%";

document.getElementById("fertility").innerHTML="Good";

}

}

</script>

</body>

</html>
