<body>

<header>

<section class="disease-page">

<h1>🌿 AI Crop Disease Detection</h1>

<p>

Upload a crop image to detect diseases and get treatment suggestions.

</p>

<div class="disease-container">

<div class="upload-box">

<img src="images/upload.png" width="120">

<h2>Upload Crop Image</h2>

<input type="file" id="cropImage">

<button onclick="detectDisease()">

🔍 Detect Disease

</button>

</div>

<div class="result-box">

<h2>Detection Result</h2>

<p><b>Disease:</b> <span id="disease">-</span></p>

<p><b>Confidence:</b> <span id="accuracy">-</span></p>

<p><b>Treatment:</b> <span id="treatment">-</span></p>

<p><b>Prevention:</b> <span id="prevention">-</span></p>

</div>

</div>

</section>

<script>

function detectDisease(){

document.getElementById("disease").innerHTML="Leaf Blight";

document.getElementById("accuracy").innerHTML="97%";

document.getElementById("treatment").innerHTML="Use Copper Fungicide once every 7 days.";

document.getElementById("prevention").innerHTML="Avoid excess watering, remove infected leaves, and maintain proper spacing.";

}

</script>
