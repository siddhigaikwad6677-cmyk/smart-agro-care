<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crop Disease Detection - Smart Agro Care</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4fff4;
    margin:0;
}

header{
    background:#2e7d32;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:80%;
    margin:30px auto;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h2{
    color:#2e7d32;
}

input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:14px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#e8f5e9;
    border-radius:10px;
}

footer{
    background:#2e7d32;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}
</style>

<script>
function detectDisease(){
    document.getElementById("result").innerHTML=
    "<h3>Detection Result</h3>" +
    "<p><b>Disease:</b> Leaf Blight</p>" +
    "<p><b>Confidence:</b> 95%</p>" +
    "<p><b>Recommendation:</b> Spray a suitable fungicide and remove infected leaves.</p>";
}
</script>

</head>

<body>

<header>
<h1>🌿 Smart Agro Care</h1>
<h2>Crop Disease Detection</h2>
</header>

<div class="container">

<div class="card">

<h2>Upload Crop Image</h2>

<input type="file">

<h2>Select Crop</h2>

<select>
<option>Select Crop</option>
<option>Rice</option>
<option>Wheat</option>
<option>Sugarcane</option>
<option>Cotton</option>
<option>Tomato</option>
<option>Potato</option>
<option>Maize</option>
</select>

<button onclick="detectDisease()">Detect Disease</button>

<div class="result" id="result">

<h3>Result</h3>

<p>No image analyzed yet.</p>

</div>

<br>

<a href="index.html">
<button>⬅ Back to Home</button>
</a>

</div>

</div>

<footer>

<p>© 2026 Smart Agro Care | Developed by Siddhi</p>

</footer>

</body>
</html>
<h2>📷 Upload Crop Image</h2>

<input type="file">

<button onclick="detectDisease()">

Detect Disease

</button>
<input type="file" accept="image/*">

<button onclick="detectDisease()">

Detect Disease

</button>
