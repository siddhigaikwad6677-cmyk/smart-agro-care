<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Smart Agro Care</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4fff4;
    margin:0;
}

header{
    background:#2e7d32;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:80%;
    margin:30px auto;
}

.contact-box{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

input,textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

textarea{
    height:120px;
}

button{
    width:100%;
    padding:14px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

.info{
    margin-top:30px;
    background:#ffffff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.info h2{
    color:#2e7d32;
}

footer{
    background:#2e7d32;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:30px;
}

a{
    color:#2e7d32;
    text-decoration:none;
}
</style>

</head>

<body>

<header>
<h1>📞 Contact Smart Agro Care</h1>
<p>We're Here to Help Farmers</p>
</header>

<div class="container">

<div class="contact-box">

<h2>Send Us a Message</h2>

<form>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="tel" placeholder="Mobile Number" required>

<input type="text" placeholder="Subject" required>

<textarea placeholder="Write your message here..." required></textarea>

<button type="submit">Send Message</button>

</form>

</div>

<div class="info">
