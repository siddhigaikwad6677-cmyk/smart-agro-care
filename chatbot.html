<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Agro AI Chatbot</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#c8f7c5,#f4fff4);
}

header{
background:#2e7d32;
color:white;
padding:20px;
text-align:center;
}

.chat-container{
width:90%;
max-width:900px;
margin:30px auto;
background:white;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
overflow:hidden;
}

.chat-box{
height:400px;
overflow-y:auto;
padding:20px;
background:#f5fff5;
}

.bot{
margin:15px 0;
text-align:left;
}

.user{
margin:15px 0;
text-align:right;
}

.bot span{
display:inline-block;
background:#e8f5e9;
padding:12px;
border-radius:15px;
}

.user span{
display:inline-block;
background:#2e7d32;
color:white;
padding:12px;
border-radius:15px;
}

.input-area{
display:flex;
padding:15px;
gap:10px;
background:white;
}

.input-area input{
flex:1;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

.input-area button{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
background:#2e7d32;
color:white;
font-size:16px;
}

.input-area button:hover{
background:#1b5e20;
}

.quick-buttons{
padding:15px;
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
background:#f0fff0;
}

.quick-buttons button{
padding:10px 18px;
border:none;
background:#4caf50;
color:white;
border-radius:8px;
cursor:pointer;
}

.quick-buttons button:hover{
background:#388e3c;
}

.extra{
padding:20px;
background:#fafafa;
}

.extra h3{
color:#2e7d32;
}

.extra input,
.extra select{
width:100%;
padding:10px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
}

footer{
background:#2e7d32;
color:white;
text-align:center;
padding:15px;
}

</style>

</head>

<body>

<header>

<h1>🤖 Smart Agro AI Assistant</h1>

<p>Your Smart Farming Companion</p>

</header>

<div class="chat-container">

<div class="chat-box" id="chat">

<div class="bot">
<span>👋 Hello Farmer! Welcome to Smart Agro Care.<br>Ask me anything about farming.</span>
</div>

</div>

<div class="quick-buttons">

<button onclick="quickQuestion('Best crop for black soil')">🌱 Best Crop</button>

<button onclick="quickQuestion('Water for rice')">💧 Water</button>

<button onclick="quickQuestion('Best fertilizer')">🧪 Fertilizer</button>

<button onclick="quickQuestion('Organic farming tips')">🌿 Organic Tips</button>

<button onclick="quickQuestion('Weather advice')">🌦 Weather</button>

<button onclick="quickQuestion('Government schemes')">🚜 Schemes</button>

</div>

<div class="input-area">

<input type="text" id="question" placeholder="Ask your question...">

<button onclick="startListening()">🎤</button>

<button onclick="reply()">Send</button>

</div>

<div class="extra">

<h3>📷 Upload Crop Image</h3>

<input type="file" id="cropImage">

<h3>📍 Select Location</h3>

<select id="district">

<option>Kolhapur</option>
<option>Pune</option>
<option>Sangli</option>
<option>Satara</option>

</select>

<button onclick="recommend()">Recommend Crop</button>

<p id="cropResult"></p>

<h3>🌐 Language</h3>

<select onchange="changeLanguage(this.value)">

<option value="en">English</option>

<option value="mr">मराठी</option>

</select>

<br><br>

<button onclick="window.print()">📄 Download Chat Report</button>

</div>

</div>

<footer>

© 2026 Smart Agro Care

</footer>

<script src="script.js"></script>

</body>
</html>
