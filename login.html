<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Agro Care - Login</title>

<link rel="stylesheet" href="style.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
url("https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1400&q=80");
background-size:cover;
background-position:center;
}

.login-box{
width:380px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
padding:35px;
border-radius:20px;
text-align:center;
color:white;
box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.login-box h1{
font-size:34px;
margin-bottom:10px;
}

.login-box p{
margin-bottom:25px;
font-size:15px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#2e7d32;
color:white;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1b5e20;
}

.signup{
margin-top:20px;
font-size:15px;
}

.signup a{
color:#ffff66;
text-decoration:none;
font-weight:bold;
}

.signup a:hover{
text-decoration:underline;
}
</style>

</head>

<body>

<div class="login-box">

<h1>🌱 Smart Agro Care</h1>

<p>Farmer Login Portal</p>

<form action="index.html">

<input type="text" placeholder="Username" required>

<input type="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<div class="signup">
Don't have an account?
<a href="signup.html">Create Account</a>
</div>

</div>

</body>
</html>
