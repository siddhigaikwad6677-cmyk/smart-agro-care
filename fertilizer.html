<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Fertilizer Recommendation</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<div class="logo">🌾 Smart Agro Care</div>

<nav>

<a href="index.html">Home</a>

<a href="disease.html">Disease</a>

</nav>

</header>

<section class="fertilizer-page">

<h1>🌱 AI Fertilizer Recommendation</h1>

<p>Select your soil type and enter NPK values.</p>

<div class="fertilizer-container">

<div class="fertilizer-form">

<label>Soil Type</label>

<select id="soil">

<option>Black Soil</option>
<option>Red Soil</option>
<option>Alluvial Soil</option>
<option>Laterite Soil</option>
<option>Sandy Soil</option>
<option>Clay Soil</option>

</select>

<label>Nitrogen (N)</label>
<input type="number" id="n">

<label>Phosphorus (P)</label>
<input type="number" id="p">

<label>Potassium (K)</label>
<input type="number" id="k">

<button onclick="recommendFertilizer()">

🌿 Get Recommendation

</button>

</div>

<div class="fertilizer-result">

<h2>Recommendation</h2>

<p><b>Recommended Fertilizer:</b> <span id="fertilizer">-</span></p>

<p><b>Application:</b> <span id="application">-</span></p>

<p><b>Water Requirement:</b> <span id="water">-</span></p>

<p><b>Additional Advice:</b> <span id="advice">-</span></p>

</div>

</div>

</section>

<script>

function recommendFertilizer(){

let soil=document.getElementById("soil").value;

if(soil=="Black Soil"){

document.getElementById("fertilizer").innerHTML="DAP + Urea";

document.getElementById("application").innerHTML="50 kg/acre";

document.getElementById("water").innerHTML="20-25 mm/week";

document.getElementById("advice").innerHTML="Suitable for Cotton and Soybean.";

}

else if(soil=="Red Soil"){

document.getElementById("fertilizer").innerHTML="NPK 20:20:20";

document.getElementById("application").innerHTML="40 kg/acre";

document.getElementById("water").innerHTML="15-20 mm/week";

document.getElementById("advice").innerHTML="Ideal for Groundnut and Millets.";

}

else if(soil=="Alluvial Soil"){

document.getElementById("fertilizer").innerHTML="Compost + Urea";

document.getElementById("application").innerHTML="45 kg/acre";

document.getElementById("water").innerHTML="25-30 mm/week";

document.getElementById("advice").innerHTML="Best for Rice and Wheat.";

}

else{

document.getElementById("fertilizer").innerHTML="Organic Compost";

document.getElementById("application").innerHTML="35 kg/acre";

document.getElementById("water").innerHTML="20 mm/week";

document.getElementById("advice").innerHTML="Improve soil health with organic manure.";

}

}

</script>

</body>

</html>
