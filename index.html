<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Agro Care | Login</title>

<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:url("images/farm.jpg") no-repeat center center/cover;

}

.overlay{

position:absolute;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.45);

}

.login-box{

position:relative;

width:420px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(12px);

padding:40px;

border-radius:20px;

text-align:center;

color:white;

box-shadow:0 10px 30px rgba(0,0,0,.4);

z-index:1;

}

.logo{

width:100px;

margin-bottom:15px;

}

h1{

margin-bottom:8px;

font-size:32px;

}

.subtitle{

margin-bottom:25px;

color:#f1f1f1;

}

.input-box{

margin:18px 0;

}

.input-box input{

width:100%;

padding:15px;

border:none;

border-radius:12px;

font-size:16px;

outline:none;

}

.login-btn{

width:100%;

padding:15px;

margin-top:20px;

background:#2e7d32;

color:white;

border:none;

border-radius:12px;

font-size:18px;

cursor:pointer;

transition:.3s;

}

.login-btn:hover{

background:#1b5e20;

transform:scale(1.03);

}

.links{

margin-top:20px;

}

.links a{

color:#fff;

text-decoration:none;

font-weight:bold;

}

.social{

margin-top:25px;

}

.social img{

width:40px;

margin:0 10px;

cursor:pointer;

transition:.3s;

}

.social img:hover{

transform:scale(1.2);

}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="login-box">

<img src="images/logo.png" class="logo">

<h1>🌾 Smart Agro Care</h1>

<p class="subtitle">AI Powered Smart Farming Solution</p>

<div class="input-box">

<input type="email" id="email" placeholder="📧 Email">

</div>

<div class="input-box">

<input type="password" id="password" placeholder="🔒 Password">

</div>

<button class="login-btn" onclick="login()">

🚀 Login

</button>

<div class="links">

<p>Don't have an account?</p>

<a href="signup.html">Create Account</a>

</div>

<div class="social">

<p style="margin-bottom:10px;">Or Continue With</p>

<img src="images/google.png">

<img src="images/facebook.png">

<img src="images/apple.png">

</div>

</div>

<script src="script.js"></script>

</body>
</html>
