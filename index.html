<section class="hero">
    <h2>Welcome to Smart Agro Care 🌱</h2>

    <p>
        Smart Agro Care is an intelligent farming website that helps farmers
        detect crop diseases, analyze soil quality, and improve crop production.
    </p>

    <button onclick="checkSoil()">🌱 Check Soil</button>

    <button onclick="cropDisease()">🍃 Detect Disease</button>
</section>
<section class="soil-form">
    <h2>🌱 Soil Testing</h2>

    <form>
        <input type="number" placeholder="Soil pH" required><br><br>

        <input type="number" placeholder="Nitrogen (N)" required><br><br>

        <input type="number" placeholder="Phosphorus (P)" required><br><br>

        <input type="number" placeholder="Potassium (K)" required><br><br>

        <input type="number" placeholder="Moisture (%)" required><br><br>

        <input type="number" placeholder="Temperature (°C)" required><br><br>

        <button type="button" onclick="soilResult()">
            Analyze Soil
        </button>
    </form>
</section>
